<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What we shipped · Grind District</title>
<meta name="description" content="Every update to Grind District, the free 3D city where you learn Web3 and walk out with a CV. Newest first.">
<meta property="og:title" content="What we shipped · Grind District">
<meta property="og:description" content="Every update to the free 3D city where you learn Web3 and walk out with a CV, resume and portfolio. Newest first.">
<meta property="og:image" content="https://www.grinddistrict.app/og-image-v2.png">
<meta property="og:url" content="https://www.grinddistrict.app/shipped.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="What we shipped · Grind District">
<meta name="twitter:image" content="https://www.grinddistrict.app/og-image-v2.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--bg:#070a09;--card:#111614;--line:#1f2925;--ink:#eef3ef;--mute:#8d9a94;--green:#2ee68a;--gold:#d8b26a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:34px}
h1{font-size:26px;margin:14px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.play{display:inline-block;background:var(--green);color:#06120c;font-weight:700;text-decoration:none;border-radius:999px;padding:10px 18px;margin:4px 8px 4px 0}
.copy{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:30px 0 10px;font-weight:600}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.item b{display:block;font-size:16px;margin-bottom:4px}
.item p{margin:0;color:#cfd8d3;font-size:15px}
.count{color:var(--mute);font-size:13px;margin-top:22px}
.err{color:#ff6b6b}
</style>
</head>
<body>
<main>
<header><img src="/brand/logo-new.png" alt="Grind District"></header>
<h1>What we shipped</h1>
<p class="sub">Every update to Grind District, newest first. A free 3D city where you learn Web3 by living it and walk out with a CV, resume and portfolio.</p>
<a class="play" href="/?src=shipped">Play free in your browser</a><button class="copy" id="copy" type="button">Copy this page's link</button>
<div id="list"><p>Loading…</p></div>
<p class="count" id="count"></p>
</main>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
// Release ids start with the month and day they shipped (u1124-… is 24 November).
const dayOf = (id) => { const m = /^u(\d\d)(\d\d)-/.exec(id); return m ? `${Number(m[2])} ${MONTHS[Number(m[1]) - 1] || ''}`.trim() : 'Earlier' }
fetch('/updates.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
  const list = (d.updates || []).slice().reverse()
  const groups = []
  for (const u of list) { const day = dayOf(u.id); let g = groups[groups.length - 1]; if (!g || g.day !== day) { g = { day, items: [] }; groups.push(g) } g.items.push(u) }
  $('list').innerHTML = groups.map((g) => `<h2>${esc(g.day)}</h2>` + g.items.map((u) => `<div class="item"><b>${esc(u.title)}</b><p>${esc(u.body)}</p></div>`).join('')).join('')
  $('count').textContent = `${list.length} updates so far.`
}).catch(() => { $('list').innerHTML = '<p class="err">Could not load the updates. Try again in a moment.</p>' })
$('copy').onclick = async () => {
  const url = 'https://www.grinddistrict.app/shipped.html?src=shipped'
  try { await navigator.clipboard.writeText(url); $('copy').textContent = 'Link copied' } catch { prompt('Copy this link', url) }
}
</script>
</body>
</html>
