[package]
name = "grind-cert"
version = "0.1.0"
edition = "2021"
description = "Grind District soulbound course certificates on Solana (issuer-only, non-transferable)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
