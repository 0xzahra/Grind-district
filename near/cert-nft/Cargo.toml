[package]
name = "grind-cert-nft"
description = "Grind District practice certificates: soulbound NEP-171 NFTs minted with a server-signed voucher."
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/0xzahra/Grind-district"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
ed25519-dalek = "2.2.0"
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
